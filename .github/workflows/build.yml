name: Build SWTG118AS RTLPlayground switch firmware

on:
  push:
    branches: [ chatgpt-normal-switch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: swtg118as-rtlplayground-switch
          path: |
            RTLPlayground/output/SWTG118AS-RTLPlayground-SWITCH-runtime-512KiB.bin
            RTLPlayground/output/SHA256SUMS.txt
          if-no-files-found: error
