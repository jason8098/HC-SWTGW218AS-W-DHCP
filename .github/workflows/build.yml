name: Build clean SWTG118AS switch firmware

on:
  push:
    branches: [ chatgpt-switch-clean ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: swtg118as-clean-switch-runtime
          path: |
            RTLPlayground/output/HC-SWTGW218AS-CLEAN-SWITCH-webflash.bin
            RTLPlayground/output/SHA256SUMS.txt
          if-no-files-found: error
